[env:rpipico2w]
platform = raspberrypi
board = rpipico2w
framework = arduino
monitor_speed = 115200
board_build.filesystem_size = 1.5m
lib_deps = 
	mikalhart/TinyGPS@0.0.0-alpha+sha.db4ef9c97a
	bblanchon/ArduinoJson@^6.21.3
